<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Selector & Priority Exercise</title>

    <style>
        p {
            color: green;
            font-size: 16px;
        }

        .important-text {
            color: purple;
        }

        #specific-text {
            color: blue;
        }

        div p {
            font-weight: bold;
        }

        div > p {
            text-decoration: underline;
        }
    </style>

    <link rel="stylesheet" href="external_styles.css">
</head>

<body>

    <h1 style="color: red;">CSS Priority Exercise</h1>

    <p class="normal-text">
        This is a normal paragraph.
    </p>

    <p class="important-text">
        This is a paragraph with an important class.
    </p>

    <p id="specific-text">
        This paragraph has a specific ID.
    </p>

    <div>

        <p>
            This paragraph is inside a div.
        </p>

        <section>
            <p>
                This paragraph is inside a section.
            </p>
        </section>

    </div>

</body>

</html>
